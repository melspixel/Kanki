name: Typed Anki bridge

on:
  push:
    branches: [rewrite-v1]
    paths:
      - 'bridge/**'
      - 'tools/run_anki_bridge_host.sh'
      - '.github/workflows/anki-bridge.yml'
      - 'third_party/anki'
  pull_request:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'tools/run_anki_bridge_host.sh'
      - '.github/workflows/anki-bridge.yml'
      - 'third_party/anki'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.92.0
      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config protobuf-compiler python3 perl make git gcc
      - name: Run canonical typed Anki host bridge gate
        env:
          PROTOC: /usr/bin/protoc
        run: bash tools/run_anki_bridge_host.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typed-anki-bridge-evidence
          path: out/host-anki/
          if-no-files-found: warn
