name: Build installable Kanki rewrite

on:
  workflow_dispatch:
  push:
    branches: [rewrite-v1]
    paths:
      - 'bridge/**'
      - 'device/**'
      - 'assets/**'
      - 'scripts/**'
      - 'packaging/**'
      - 'tools/build_kindle_package.sh'
      - 'tools/install_kindlehf_toolchain.sh'
      - 'third_party/anki'
      - 'third_party/kindle-sdk'
      - 'third_party/audiobook-koplugin'
      - '.github/workflows/package.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'device/**'
      - 'assets/**'
      - 'scripts/**'
      - 'packaging/**'
      - 'tools/build_kindle_package.sh'
      - 'tools/install_kindlehf_toolchain.sh'
      - 'third_party/anki'
      - 'third_party/kindle-sdk'
      - 'third_party/audiobook-koplugin'
      - '.github/workflows/package.yml'

permissions:
  contents: read

jobs:
  package-kindlehf:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.92.0
          target: armv7-unknown-linux-gnueabihf
      - name: Install Linux host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config protobuf-compiler python3 perl make git curl file binutils zip unzip zstd
      - name: Build and validate Kindle package with canonical recipe
        run: bash tools/build_kindle_package.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kanki-rewrite-hw3
          path: |
            out/local-kindle/Kanki-rewrite-hw3.zip
            out/local-kindle/Kanki-rewrite-hw3.zip.sha256
            out/local-kindle/package-contents.txt
            out/local-kindle/package-exports.txt
            out/local-kindle/package-glibc.txt
            out/local-kindle/sysroot-glibc.txt
            out/local-kindle/toolchain-info.txt
          if-no-files-found: warn
