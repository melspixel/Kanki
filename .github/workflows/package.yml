name: Build installable Kanki rewrite

on:
  workflow_dispatch:
  push:
    branches: [rewrite-v1]
    paths:
      - 'bridge/**'
      - 'device/**'
      - 'assets/**'
      - 'scripts/**'
      - 'packaging/**'
      - 'tools/install_kindlehf_toolchain.sh'
      - 'third_party/anki'
      - 'third_party/audiobook-koplugin'
      - '.github/workflows/package.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'device/**'
      - 'assets/**'
      - 'scripts/**'
      - 'packaging/**'
      - 'tools/install_kindlehf_toolchain.sh'
      - 'third_party/anki'
      - 'third_party/audiobook-koplugin'
      - '.github/workflows/package.yml'

permissions:
  contents: read

jobs:
  package-kindlehf:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      TARGET: armv7-unknown-linux-gnueabihf
      TRIPLE: arm-kindlehf-linux-gnueabihf
      ANKI_COMMIT: e5a6fbe27fdd4d57d5f712191b4a753032e57853
      KINDLE_SDK_COMMIT: b4a6c99d718a7cf74935f36105c62491b4336a61
      AUDIOBOOK_COMMIT: 62edf76feb1b7f4af2f01754957e8d57eb3e7d67
      MINIAUDIO_COMMIT: 4a5b74bef029b3592c54b6048650ee5f972c1a48
      KOX_VERSION: '2026.08'
      KOX_SHA256: 8cc7dfbd71abd78f9e947d6b2e20670288a4402edc7b07176bca791f7eaf87d0
      PROTOC: /usr/bin/protoc
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.92.0
          target: armv7-unknown-linux-gnueabihf
      - name: Install dependencies and pinned KindleHF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config protobuf-compiler python3 perl make git curl file binutils zip zstd
          test "$(git -C third_party/anki rev-parse HEAD)" = "$ANKI_COMMIT"
          test "$(git -C third_party/audiobook-koplugin rev-parse HEAD)" = "$AUDIOBOOK_COMMIT"
          git -C third_party/anki submodule update --init --depth 1 ftl/core-repo ftl/qt-repo
          mkdir -p third_party/anki/out/rslib/proto third_party/anki/out/extracted/protoc/bin
          ln -sf /usr/bin/protoc third_party/anki/out/extracted/protoc/bin/protoc
          bash tools/install_kindlehf_toolchain.sh | tee toolchain-info.txt
          grep -q "KANKI_KOX_VERSION=$KOX_VERSION" toolchain-info.txt
          grep -q "KANKI_KOX_SHA256=$KOX_SHA256" toolchain-info.txt
          TC="$HOME/x-tools/$TRIPLE"
          echo "$TC/bin" >> "$GITHUB_PATH"
          echo "KHF_SYSROOT=$TC/$TRIPLE/sysroot" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=$TC/bin/$TRIPLE-gcc" >> "$GITHUB_ENV"
          echo "CC_armv7_unknown_linux_gnueabihf=$TC/bin/$TRIPLE-gcc" >> "$GITHUB_ENV"
          echo "CXX_armv7_unknown_linux_gnueabihf=$TC/bin/$TRIPLE-g++" >> "$GITHUB_ENV"
          echo "AR_armv7_unknown_linux_gnueabihf=$TC/bin/$TRIPLE-ar" >> "$GITHUB_ENV"
          echo "CFLAGS_armv7_unknown_linux_gnueabihf=-march=armv7-a -mtune=cortex-a7 -mfpu=neon -mfloat-abi=hard -fno-stack-protector -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0" >> "$GITHUB_ENV"
          echo "CXXFLAGS_armv7_unknown_linux_gnueabihf=-march=armv7-a -mtune=cortex-a7 -mfpu=neon -mfloat-abi=hard -fno-stack-protector -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C target-cpu=cortex-a7 -C link-arg=-Wl,--as-needed" >> "$GITHUB_ENV"
          curl -fL --retry 3 "https://raw.githubusercontent.com/mackron/miniaudio/$MINIAUDIO_COMMIT/miniaudio.h" -o device/audio/miniaudio.h
      - name: Embed typed Kanki bridge into pinned Anki
        run: |
          cp bridge/anki_bridge.rs third_party/anki/rslib/src/kanki_bridge.rs
          cp bridge/sync_bridge.rs third_party/anki/rslib/src/kanki_sync_bridge.rs
          python3 - <<'PY'
          from pathlib import Path
          lib = Path('third_party/anki/rslib/src/lib.rs')
          text = lib.read_text()
          needle = 'pub mod version;'
          assert needle in text
          lib.write_text(text.replace(needle, needle + '\npub mod kanki_bridge;\npub mod kanki_sync_bridge;', 1))
          cargo = Path('third_party/anki/rslib/Cargo.toml')
          text = cargo.read_text()
          if '[lib]' not in text:
              text += '\n[lib]\ncrate-type = ["cdylib"]\n'
          cargo.write_text(text)
          PY
      - name: Build typed Anki backend
        working-directory: third_party/anki
        env:
          PROTOC: /usr/bin/protoc
        run: cargo build -p anki --release --target "$TARGET" --features rustls
      - name: Build device, sync, diagnostics, reactivation and audio executables
        run: |
          arm-kindlehf-linux-gnueabihf-gcc -std=c11 -Os -fsigned-char -Wall -Wextra -Werror -Ibridge \
            -DKANKI_BUILD_COMMIT=\"$GITHUB_SHA\" -DKANKI_ANKI_COMMIT=\"$ANKI_COMMIT\" \
            device/kanki_device.c -ldl -o kanki-device
          arm-kindlehf-linux-gnueabihf-gcc -std=c11 -Os -fsigned-char -Wall -Wextra -Werror -Ibridge \
            device/kanki_sync_cli.c -ldl -o kanki-sync
          arm-kindlehf-linux-gnueabihf-gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Os -fsigned-char -Wall -Wextra -Werror \
            device/kanki_diag_server.c -o kanki-diag
          arm-kindlehf-linux-gnueabihf-gcc -std=c11 -Os -fsigned-char -Wall -Wextra -Werror \
            -ffreestanding -fno-builtin -fno-stack-protector -nostdlib \
            -Wl,-e,_start -Wl,--dynamic-linker=/lib/ld-linux-armhf.so.3 \
            device/kanki_raise.c -ldl -o kanki-raise
          arm-kindlehf-linux-gnueabihf-gcc -std=c11 -D_XOPEN_SOURCE=700 -O2 -Wall -Wextra -Werror \
            -Idevice/audio device/audio/kanki_audio_server.c -o kanki-audio -lm -latomic
          arm-kindlehf-linux-gnueabihf-gcc -std=gnu11 -D_GNU_SOURCE -D_POSIX_C_SOURCE=200809L \
            -O2 -Wall -Wextra -Werror -DKGP_NATIVE_GLIBC \
            third_party/audiobook-koplugin/kindle/gst-play.c -o kanki-gst-play -ldl
          file kanki-device kanki-sync kanki-diag kanki-raise kanki-audio kanki-gst-play
          ! arm-kindlehf-linux-gnueabihf-nm -D kanki-raise | grep -E ' U (malloc|free|memcpy|memset|fprintf|getenv|setenv|write)$'
      - name: Assemble self-identifying installation
        run: |
          ROOT=package
          EXT="$ROOT/extensions/kanki"
          mkdir -p "$EXT/assets/device" "$EXT/assets/reviewer" "$ROOT/documents"
          cp third_party/anki/target/$TARGET/release/libanki.so "$EXT/libanki-kanki.so"
          cp kanki-device kanki-sync kanki-diag kanki-raise kanki-audio kanki-gst-play "$EXT/"
          cp assets/device/* "$EXT/assets/device/"
          cp assets/reviewer/reviewer.css assets/reviewer/reviewer.js \
             assets/reviewer/css_compat.js assets/reviewer/css_runtime.js \
             "$EXT/assets/reviewer/"
          cp scripts/kanki-launch.sh scripts/kanki-sync.sh scripts/kanki-report.sh "$EXT/"
          cp packaging/config.example.ini "$EXT/"
          cp THIRD_PARTY_NOTICES.md docs/INSTALL.md "$EXT/"
          cp packaging/documents/* "$ROOT/documents/"
          cat > "$EXT/BUILD.json" <<EOF
          {
            "version": "0.1.0-hw3",
            "kanki_commit": "$GITHUB_SHA",
            "anki_commit": "$ANKI_COMMIT",
            "kindle_sdk_commit": "$KINDLE_SDK_COMMIT",
            "audiobook_commit": "$AUDIOBOOK_COMMIT",
            "miniaudio_commit": "$MINIAUDIO_COMMIT",
            "koxtoolchain_version": "$KOX_VERSION",
            "koxtoolchain_sha256": "$KOX_SHA256",
            "target": "$TARGET",
            "reviewer_protocol": 1,
            "diagnostics_protocol": 1,
            "release_gate": "PW6 hardware acceptance required"
          }
          EOF
          chmod 755 "$EXT/kanki-device" "$EXT/kanki-sync" "$EXT/kanki-diag" "$EXT/kanki-raise" "$EXT/kanki-audio" "$EXT/kanki-gst-play" "$EXT/kanki-launch.sh" "$EXT/kanki-sync.sh" "$EXT/kanki-report.sh" "$ROOT/documents/"*.sh
          (cd "$EXT" && find . -type f ! -name MANIFEST.sha256 ! -name config.ini ! -name kanki.log -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256)
          (cd "$ROOT" && zip -qr ../Kanki-rewrite-hw3.zip extensions documents)
          sha256sum Kanki-rewrite-hw3.zip > Kanki-rewrite-hw3.zip.sha256
      - name: Package and ABI gates
        run: |
          EXT=package/extensions/kanki
          test -x "$EXT/kanki-raise"
          test -x "$EXT/kanki-diag"
          test -x "$EXT/kanki-report.sh"
          test -f "$EXT/assets/reviewer/css_compat.js"
          test -f "$EXT/assets/reviewer/css_runtime.js"
          test -f "$EXT/assets/device/sync.html"
          grep -q 'css_compat.js' "$EXT/assets/device/reviewer-shell.html"
          grep -q 'css_runtime.js' "$EXT/assets/device/reviewer-shell.html"
          grep -q 'kanki://sync/run?mode=normal' "$EXT/assets/device/sync.html"
          grep -q 'kanki://sync/run?mode=upload' "$EXT/assets/device/sync.html"
          grep -q 'kanki://sync/run?mode=download' "$EXT/assets/device/sync.html"
          grep -q 'DISPLAY="${DISPLAY:-:0}"' "$EXT/kanki-launch.sh"
          grep -q 'render-debug' "$EXT/kanki-launch.sh"
          grep -q 'enable-render-capture' "$EXT/kanki-diag"
          grep -q "\"koxtoolchain_version\": \"$KOX_VERSION\"" "$EXT/BUILD.json"
          grep -q "\"koxtoolchain_sha256\": \"$KOX_SHA256\"" "$EXT/BUILD.json"
          ! grep -R -F 'releases/latest/download/kindlehf' .github/workflows tools
          (cd "$EXT" && sha256sum -c MANIFEST.sha256)
          unzip -l Kanki-rewrite-hw3.zip | tee package-contents.txt
          ! unzip -l Kanki-rewrite-hw3.zip | grep -E 'extensions/ranki|LD_PRELOAD|collection\.anki2|config\.ini$'
          nm -D "$EXT/libanki-kanki.so" | grep -E ' kanki_(core_new|open_collection_json|next_card_json|prepare_answer_json|answer_json|sync_core_new|sync_collection_json|sync_full_json|sync_media_json)$' | tee package-exports.txt
          for file in "$EXT/libanki-kanki.so" "$EXT/kanki-device" "$EXT/kanki-sync" "$EXT/kanki-diag" "$EXT/kanki-raise" "$EXT/kanki-audio" "$EXT/kanki-gst-play"; do
            readelf --version-info "$file" | grep -oE 'GLIBC_[0-9.]+' || true
          done | sort -Vu | tee package-glibc.txt
          LIBC=$(find "$KHF_SYSROOT" -name libc.so.6 | head -1)
          readelf --version-info "$LIBC" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu > sysroot-glibc.txt
          python3 - <<'PY'
          from pathlib import Path
          def versions(path):
              return [tuple(map(int, line.split('_',1)[1].split('.'))) for line in Path(path).read_text().splitlines() if line]
          required, available = versions('package-glibc.txt'), versions('sysroot-glibc.txt')
          if required and available and max(required) > max(available):
              raise SystemExit(f'package requires {max(required)}, sysroot provides {max(available)}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kanki-rewrite-hw3
          path: |
            Kanki-rewrite-hw3.zip
            Kanki-rewrite-hw3.zip.sha256
            package-contents.txt
            package-exports.txt
            package-glibc.txt
            sysroot-glibc.txt
            toolchain-info.txt
