name: Rewrite host gates

on:
  push:
    branches: [rewrite-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.92.0
          components: rustfmt,clippy
      - name: Run canonical host gates
        run: sh tools/run_host_gates.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rewrite-host-evidence-${{ github.sha }}
          path: |
            out/host-mathjax/install.txt
            out/host-mathjax/vendor-contract.txt
          if-no-files-found: warn

  typed-anki-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Run canonical typed-Anki Docker gate
        run: sh tools/local_anki_bridge_docker.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typed-anki-host-evidence-${{ github.sha }}
          path: out/host-anki/
          if-no-files-found: warn
