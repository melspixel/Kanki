name: Kindle Anki Port build

on:
  workflow_dispatch:
  push:
    branches: [kindle-anki-port]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ANKI_COMMIT: e5a6fbe27fdd4d57d5f712191b4a753032e57853
  KOX_TAG: '2025.05'
  KOX_TRIPLE: arm-kindlehf-linux-gnueabihf
  RUST_TARGET: armv7-unknown-linux-gnueabihf
  PROJECT: ${{ github.workspace }}/kindle-anki-port

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils clang curl file git jq make nodejs \
            python3 protobuf-compiler qemu-user-static unzip zip pkg-config \
            cmake ninja-build perl

      - name: Static, native-host and lifecycle gates
        working-directory: kindle-anki-port
        run: |
          set -euo pipefail
          make static-test

      - name: Fetch exact official Anki source and Fluent repositories
        run: |
          set -euo pipefail
          rm -rf /tmp/anki
          git init /tmp/anki
          git -C /tmp/anki remote add origin https://github.com/ankitects/anki.git
          git -C /tmp/anki fetch --depth 1 origin "$ANKI_COMMIT"
          git -C /tmp/anki checkout --detach FETCH_HEAD
          test "$(git -C /tmp/anki rev-parse HEAD)" = "$ANKI_COMMIT"
          git -C /tmp/anki submodule update --init --depth 1 ftl/core-repo ftl/qt-repo
          python3 "$PROJECT/tools/inject_into_anki.py" \
            --project "$PROJECT" --anki /tmp/anki --skip-submodules

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          targets: armv7-unknown-linux-gnueabihf

      - name: Prime Cargo cache for deterministic offline gates
        run: |
          set -euo pipefail
          cargo fetch --manifest-path /tmp/anki/Cargo.toml --locked

      - name: Full host Anki backend gate
        env:
          ANKI: /tmp/anki
          CARGO_HOME: ${{ runner.home }}/.cargo
          PROTOC: /usr/bin/protoc
        run: |
          set -euo pipefail
          "$PROJECT/testenv/scripts/run-host-backend-gates.sh" \
            | tee "$RUNNER_TEMP/host-backend-gates.log"

      - name: Fetch Kindle hard-float toolchain
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/koreader/koxtoolchain/releases/download/${KOX_TAG}/kindlehf.tar.gz" \
            -o /tmp/kindlehf.tar.gz
          tar -xzf /tmp/kindlehf.tar.gz -C "$HOME"
          test -x "$HOME/x-tools/$KOX_TRIPLE/bin/$KOX_TRIPLE-gcc"

      - name: QEMU ARMHF host sanity
        env:
          TOOLCHAIN_BIN: ${{ runner.home }}/x-tools/arm-kindlehf-linux-gnueabihf/bin
        run: |
          set -euo pipefail
          PROJECT="$PROJECT" OUT="$RUNNER_TEMP/qemu-host-sanity" \
            bash "$PROJECT/testenv/scripts/run-qemu-host-sanity.sh"

      - name: ARMHF cross-build and ABI audit
        env:
          ANKI: /tmp/anki
          CARGO_HOME: ${{ runner.home }}/.cargo
          PROTOC: /usr/bin/protoc
          TOOLCHAIN_BIN: ${{ runner.home }}/x-tools/arm-kindlehf-linux-gnueabihf/bin
          OUT: ${{ runner.temp }}/kap-armhf
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          "$PROJECT/testenv/scripts/run-armhf-gates.sh" \
            | tee "$RUNNER_TEMP/armhf-gates.log"

      - name: Assemble and audit installation archive
        env:
          ARMHF: ${{ runner.temp }}/kap-armhf
          RELEASE: ${{ github.workspace }}/release
          BUILD_COMMIT: ${{ github.sha }}
          VERSION: 0.1.0-dev
        run: |
          set -euo pipefail
          "$PROJECT/testenv/scripts/package-and-audit.sh" \
            | tee "$RUNNER_TEMP/package-gates.log"
          cp "$RUNNER_TEMP/host-backend-gates.log" release/
          cp "$RUNNER_TEMP/armhf-gates.log" release/
          cp "$RUNNER_TEMP/package-gates.log" release/
          cp -R "$RUNNER_TEMP/qemu-host-sanity" release/qemu-host-sanity
          cp "$PROJECT/testenv/qemu/pw6-5.19.6-rootfs-manifest.json" release/
          git archive --format=tar.gz \
            --output=release/Kindle-Anki-Port-source-${GITHUB_SHA}.tar.gz \
            "$GITHUB_SHA" kindle-anki-port
          (cd release && sha256sum Kindle-Anki-Port-source-*.tar.gz \
            > Kindle-Anki-Port-source.tar.gz.sha256)

      - name: Upload audited release checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: Kindle-Anki-Port-PW6-armhf-${{ github.sha }}
          path: release/
          retention-days: 90
          if-no-files-found: error
