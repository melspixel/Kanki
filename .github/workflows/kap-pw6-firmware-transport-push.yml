name: Temporary KAP PW6 firmware transport retry

# One-shot push-triggered transport on a disposable branch. It is never merged.
on:
  push:
    branches: [transport/kap-pw6-firmware-20260822]
    paths:
      - '.github/workflows/kap-pw6-firmware-transport-push.yml'

permissions:
  contents: read

env:
  FIRMWARE_URL: https://s3.amazonaws.com/firmwaredownloads/update_kindle_all_new_paperwhite_12th_5.19.6.bin
  FIRMWARE_SHA256: 72445ffe3142991535902922a69969b913d4b27c58af4ceda1a3dc5ffadd143c
  FIRMWARE_MD5: 697aeb33c02f46b9b0911ab05c28b06d
  KINDLETOOL_COMMIT: 95291295e039a1a3bc0bc9d6040b07f640dae74a

jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install acquisition and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl pkg-config zlib1g-dev libarchive-dev nettle-dev

      - name: Download and verify official PW6 5.19.6 firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kap-pw6-transport
          out=/tmp/kap-pw6-transport/update_kindle_all_new_paperwhite_12th_5.19.6.bin
          curl -fL --retry 4 --connect-timeout 30 "$FIRMWARE_URL" -o "$out"
          printf '%s  %s\n' "$FIRMWARE_SHA256" "$out" | sha256sum -c -
          printf '%s  %s\n' "$FIRMWARE_MD5" "$out" | md5sum -c -
          stat -c 'firmware_size=%s' "$out" | tee /tmp/kap-pw6-transport/firmware-size.txt

      - name: Build pinned KindleTool
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/KindleTool
          git -C /tmp/KindleTool remote add origin https://github.com/NiLuJe/KindleTool.git
          git -C /tmp/KindleTool fetch --depth 1 origin "$KINDLETOOL_COMMIT"
          git -C /tmp/KindleTool checkout --detach FETCH_HEAD
          test "$(git -C /tmp/KindleTool rev-parse HEAD)" = "$KINDLETOOL_COMMIT"
          make -C /tmp/KindleTool -j2
          test -x /tmp/KindleTool/KindleTool/Release/kindletool
          /tmp/KindleTool/KindleTool/Release/kindletool version \
            | tee /tmp/kap-pw6-transport/kindletool-version.txt
          cp /tmp/KindleTool/KindleTool/Release/kindletool \
            /tmp/kap-pw6-transport/kindletool
          cp /tmp/KindleTool/LICENSE /tmp/kap-pw6-transport/KindleTool-LICENSE
          printf '%s\n' "$KINDLETOOL_COMMIT" \
            > /tmp/kap-pw6-transport/KINDLETOOL_COMMIT.txt

      - name: Split and verify transport pieces
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/kap-pw6-transport
          split -b 120000000 -d -a 2 \
            update_kindle_all_new_paperwhite_12th_5.19.6.bin firmware.part.
          test "$(find . -maxdepth 1 -name 'firmware.part.*' | wc -l)" -eq 4
          cat firmware.part.* > firmware.reassembled.bin
          printf '%s  %s\n' "$FIRMWARE_SHA256" firmware.reassembled.bin | sha256sum -c -
          rm firmware.reassembled.bin
          sha256sum firmware.part.* kindletool KindleTool-LICENSE \
            KINDLETOOL_COMMIT.txt kindletool-version.txt firmware-size.txt \
            > SHA256SUMS
          {
            printf 'source=official Amazon firmware object\n'
            printf 'firmware_url=%s\n' "$FIRMWARE_URL"
            printf 'firmware_sha256=%s\n' "$FIRMWARE_SHA256"
            printf 'firmware_md5=%s\n' "$FIRMWARE_MD5"
            printf 'kindletool_commit=%s\n' "$KINDLETOOL_COMMIT"
            printf 'part_size=120000000\n'
            printf 'part_count=4\n'
          } > PROVENANCE.txt

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: KAP-PW6-5.19.6-firmware-part-00
          path: /tmp/kap-pw6-transport/firmware.part.00
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: KAP-PW6-5.19.6-firmware-part-01
          path: /tmp/kap-pw6-transport/firmware.part.01
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: KAP-PW6-5.19.6-firmware-part-02
          path: /tmp/kap-pw6-transport/firmware.part.02
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: KAP-PW6-5.19.6-firmware-part-03
          path: /tmp/kap-pw6-transport/firmware.part.03
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload pinned KindleTool and provenance
        uses: actions/upload-artifact@v4
        with:
          name: KAP-PW6-5.19.6-tools-and-provenance
          path: |
            /tmp/kap-pw6-transport/kindletool
            /tmp/kap-pw6-transport/KindleTool-LICENSE
            /tmp/kap-pw6-transport/KINDLETOOL_COMMIT.txt
            /tmp/kap-pw6-transport/kindletool-version.txt
            /tmp/kap-pw6-transport/firmware-size.txt
            /tmp/kap-pw6-transport/PROVENANCE.txt
            /tmp/kap-pw6-transport/SHA256SUMS
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
