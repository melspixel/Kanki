name: Kindle audio service

on:
  push:
    branches: [rewrite-v1]
    paths:
      - 'device/audio/**'
      - 'scripts/kanki-launch.sh'
      - 'third_party/audiobook-koplugin'
      - '.github/workflows/audio.yml'
  pull_request:
    branches: [main]
    paths:
      - 'device/audio/**'
      - 'scripts/kanki-launch.sh'
      - 'third_party/audiobook-koplugin'
      - '.github/workflows/audio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  armhf-audio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install KindleHF toolchain and pinned decoder
        run: |
          wget -q https://github.com/KindleModding/koxtoolchain/releases/latest/download/kindlehf.tar.gz -O /tmp/kindlehf.tar.gz
          tar -xzf /tmp/kindlehf.tar.gz -C "$HOME"
          echo "$HOME/x-tools/arm-kindlehf-linux-gnueabihf/bin" >> "$GITHUB_PATH"
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/mackron/miniaudio/4a5b74bef029b3592c54b6048650ee5f972c1a48/miniaudio.h \
            -o device/audio/miniaudio.h
      - name: Build source-owned audio service and native mixersink player
        run: |
          arm-kindlehf-linux-gnueabihf-gcc -std=c11 -O2 -Wall -Wextra -Werror \
            -Idevice/audio device/audio/kanki_audio_server.c -o kanki-audio -lm -latomic
          arm-kindlehf-linux-gnueabihf-gcc -std=c11 -O2 -Wall -Wextra -Werror \
            -DKGP_NATIVE_GLIBC third_party/audiobook-koplugin/kindle/gst-play.c \
            -o kanki-gst-play -ldl
          file kanki-audio kanki-gst-play
          arm-kindlehf-linux-gnueabihf-readelf --version-info kanki-audio \
            | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tee audio-glibc.txt || true
          arm-kindlehf-linux-gnueabihf-readelf --version-info kanki-gst-play \
            | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tee gst-glibc.txt || true
      - name: Verify HTTP surface and source policy
        run: |
          grep -q '127.0.0.1' device/audio/kanki_audio_server.c || grep -q 'INADDR_LOOPBACK' device/audio/kanki_audio_server.c
          grep -q 'mixersink stream-type=Music sync=true' third_party/audiobook-koplugin/kindle/gst-play.c
          ! grep -R -E 'system\(|popen\(' device/audio
      - uses: actions/upload-artifact@v4
        with:
          name: kindle-audio-service
          path: |
            kanki-audio
            kanki-gst-play
            audio-glibc.txt
            gst-glibc.txt
