name: One-shot typed answer UI migration

on:
  push:
    branches: [rewrite-v1]
    paths:
      - 'tools/patch_type_answer_ui.py'
      - '.github/workflows/one-shot-type-answer-ui.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source-owned typed-answer UI migration
        run: python3 tools/patch_type_answer_ui.py
      - name: Syntax and renderer gates
        run: |
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -fsigned-char -Wall -Wextra -Werror -fsyntax-only device/kanki_device.c -Ibridge
          node --check assets/reviewer/reviewer.js
          node --check tests/renderer_contract.test.cjs
          npm install --no-save --ignore-scripts jsdom@24.1.3
          node tests/renderer_contract.test.cjs
      - name: Commit only migrated production/test sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add device/kanki_device.c assets/reviewer/reviewer.js tests/renderer_contract.test.cjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'typed-answer UI already migrated'
            exit 0
          fi
          git commit -m 'Route Show Answer through typed Anki backend'
          git push origin HEAD:rewrite-v1
