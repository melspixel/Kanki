name: Rewrite CI

on:
  push:
    branches: [rewrite-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.92.0
          components: rustfmt,clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Source pins
        run: |
          test "$(git -C third_party/anki rev-parse HEAD)" = e5a6fbe27fdd4d57d5f712191b4a753032e57853
          test "$(git -C third_party/ranki-reference rev-parse HEAD)" = d671ee657f0c411474d2afff3bf9cbb49be2fb44
          test "$(git -C third_party/kindle-sdk rev-parse HEAD)" = b4a6c99d718a7cf74935f36105c62491b4336a61
          test "$(git -C third_party/audiobook-koplugin rev-parse HEAD)" = 62edf76feb1b7f4af2f01754957e8d57eb3e7d67
      - name: Format, lint and policy
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          python3 tools/check_policy.py
          node --check assets/reviewer/reviewer.js
          node --check assets/device/decks.js
          node --check tests/renderer_contract.test.cjs
      - name: Host tests, renderer contract and self-test
        run: |
          cargo test --workspace
          npm install --no-save --ignore-scripts jsdom@24.1.3
          node tests/renderer_contract.test.cjs | tee renderer-contract.txt
          grep -q 'renderer contract: pass' renderer-contract.txt
          cargo run -p kanki-app -- --self-test | tee self-test.json
          grep -q '"result": "pass"' self-test.json
      - name: Source handoff artifact
        run: |
          mkdir -p out
          git archive --format=tar.gz -o out/kanki-rewrite-source.tar.gz HEAD
          sha256sum out/kanki-rewrite-source.tar.gz > out/kanki-rewrite-source.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rewrite-host-evidence
          path: |
            self-test.json
            renderer-contract.txt
            out/

  arm-skeleton:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.92.0
          target: armv7-unknown-linux-gnueabihf
      - name: Install KindleHF toolchain
        run: |
          wget -q https://github.com/KindleModding/koxtoolchain/releases/latest/download/kindlehf.tar.gz -O /tmp/kindlehf.tar.gz
          tar -xzf /tmp/kindlehf.tar.gz -C "$HOME"
          echo "$HOME/x-tools/arm-kindlehf-linux-gnueabihf/bin" >> "$GITHUB_PATH"
      - name: Cross-build source-owned executable scaffold
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-kindlehf-linux-gnueabihf-gcc
          RUSTFLAGS: -C target-cpu=cortex-a7 -C link-arg=-Wl,--as-needed
        run: |
          cargo build --release -p kanki-app --target armv7-unknown-linux-gnueabihf
          file target/armv7-unknown-linux-gnueabihf/release/kanki-app
          readelf -h target/armv7-unknown-linux-gnueabihf/release/kanki-app | tee arm-elf.txt
          readelf --version-info target/armv7-unknown-linux-gnueabihf/release/kanki-app | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tee arm-glibc.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: rewrite-arm-skeleton
          path: |
            target/armv7-unknown-linux-gnueabihf/release/kanki-app
            arm-elf.txt
            arm-glibc.txt
