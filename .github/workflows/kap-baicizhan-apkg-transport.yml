name: Temporary encrypted Baicizhan APKG transport

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kap-baicizhan-apkg-transport.yml'

permissions:
  contents: read

env:
  DRIVE_FILE_ID: '1KDKZM9SgbvdL1X6xmoqpDmv-_1Yq2_7W'
  EXPECTED_NAME: '百词斩考研.apkg'
  EXPECTED_SIZE: '310827578'
  RECIPIENT_FINGERPRINT: 'A080871C2E46EBFF7530255232D4AB3C64742145'

jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install bounded public-file downloader
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'gdown==5.2.0'
          gdown --version

      - name: Download and validate the public Drive APKG
        shell: bash
        run: |
          set -euo pipefail
          OUT="/tmp/$EXPECTED_NAME"
          gdown "https://drive.google.com/uc?id=$DRIVE_FILE_ID" --output "$OUT"
          test -f "$OUT"
          actual_size=$(stat -c '%s' "$OUT")
          test "$actual_size" = "$EXPECTED_SIZE"
          python3 - "$OUT" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          path = Path(sys.argv[1])
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              supported = {"collection.anki2", "collection.anki21", "collection.anki21b"}
              if not supported.intersection(names):
                  raise SystemExit("APKG has no supported collection payload")
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f"corrupt APKG member: {bad}")
              print(f"validated_apkg_members={len(names)}")
          PY
          sha256sum "$OUT" | tee /tmp/BAICIZHAN-PLAINTEXT.sha256

      - name: Encrypt before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          gpg --batch --import transport/kap-baicizhan-public.asc
          actual_fpr=$(gpg --batch --with-colons --list-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$actual_fpr" = "$RECIPIENT_FINGERPRINT"
          gpg --batch --yes --trust-model always --compress-algo none \
            --recipient "$RECIPIENT_FINGERPRINT" \
            --output /tmp/baicizhan-original.apkg.gpg \
            --encrypt "/tmp/$EXPECTED_NAME"
          rm -f "/tmp/$EXPECTED_NAME"
          test -s /tmp/baicizhan-original.apkg.gpg
          sha256sum /tmp/baicizhan-original.apkg.gpg | tee /tmp/BAICIZHAN-CIPHERTEXT.sha256
          {
            printf 'purpose=one-time encrypted transport of user-owned APKG\n'
            printf 'drive_file_id=%s\n' "$DRIVE_FILE_ID"
            printf 'expected_name=%s\n' "$EXPECTED_NAME"
            printf 'expected_size=%s\n' "$EXPECTED_SIZE"
            printf 'recipient_fingerprint=%s\n' "$RECIPIENT_FINGERPRINT"
            printf 'plaintext_uploaded_to_github=false\n'
            printf 'retention_days=1\n'
          } >/tmp/PROVENANCE.txt

      - name: Upload ciphertext only
        uses: actions/upload-artifact@v4
        with:
          name: KAP-encrypted-baicizhan-original-20260823
          path: |
            /tmp/baicizhan-original.apkg.gpg
            /tmp/BAICIZHAN-PLAINTEXT.sha256
            /tmp/BAICIZHAN-CIPHERTEXT.sha256
            /tmp/PROVENANCE.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
