name: Typed Anki bridge ARMHF

on:
  push:
    branches: [rewrite-v1]
    paths:
      - 'bridge/**'
      - 'third_party/anki'
      - 'tools/install_kindlehf_toolchain.sh'
      - '.github/workflows/anki-bridge-arm.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'third_party/anki'
      - 'tools/install_kindlehf_toolchain.sh'
      - '.github/workflows/anki-bridge-arm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kindlehf-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET: armv7-unknown-linux-gnueabihf
      TRIPLE: arm-kindlehf-linux-gnueabihf
      PROTOC: /usr/bin/protoc
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.92.0
          target: armv7-unknown-linux-gnueabihf
      - name: Install build dependencies and pinned KindleHF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config protobuf-compiler python3 perl make git curl file binutils zstd
          git -C third_party/anki submodule update --init --depth 1 ftl/core-repo ftl/qt-repo
          mkdir -p third_party/anki/out/rslib/proto third_party/anki/out/extracted/protoc/bin
          ln -sf /usr/bin/protoc third_party/anki/out/extracted/protoc/bin/protoc
          bash tools/install_kindlehf_toolchain.sh
          TC="$HOME/x-tools/$TRIPLE"
          echo "$TC/bin" >> "$GITHUB_PATH"
          echo "KHF_SYSROOT=$TC/$TRIPLE/sysroot" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=$TC/bin/$TRIPLE-gcc" >> "$GITHUB_ENV"
          echo "CC_armv7_unknown_linux_gnueabihf=$TC/bin/$TRIPLE-gcc" >> "$GITHUB_ENV"
          echo "CXX_armv7_unknown_linux_gnueabihf=$TC/bin/$TRIPLE-g++" >> "$GITHUB_ENV"
          echo "AR_armv7_unknown_linux_gnueabihf=$TC/bin/$TRIPLE-ar" >> "$GITHUB_ENV"
          echo "CFLAGS_armv7_unknown_linux_gnueabihf=-march=armv7-a -mtune=cortex-a7 -mfpu=neon -mfloat-abi=hard -fno-stack-protector -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0" >> "$GITHUB_ENV"
          echo "CXXFLAGS_armv7_unknown_linux_gnueabihf=-march=armv7-a -mtune=cortex-a7 -mfpu=neon -mfloat-abi=hard -fno-stack-protector -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C target-cpu=cortex-a7 -C link-arg=-Wl,--as-needed" >> "$GITHUB_ENV"
      - name: Embed semantic bridges
        run: |
          cp bridge/anki_bridge.rs third_party/anki/rslib/src/kanki_bridge.rs
          cp bridge/sync_bridge.rs third_party/anki/rslib/src/kanki_sync_bridge.rs
          python3 - <<'PY'
          from pathlib import Path
          lib = Path('third_party/anki/rslib/src/lib.rs')
          text = lib.read_text()
          needle = 'pub mod version;'
          assert needle in text
          lib.write_text(text.replace(
              needle,
              needle + '\npub mod kanki_bridge;\npub mod kanki_sync_bridge;',
              1,
          ))
          cargo = Path('third_party/anki/rslib/Cargo.toml')
          text = cargo.read_text()
          if '[lib]' not in text:
              text += '\n[lib]\ncrate-type = ["cdylib"]\n'
          cargo.write_text(text)
          PY
      - name: Build typed Anki backend for KindleHF
        working-directory: third_party/anki
        env:
          PROTOC: /usr/bin/protoc
        run: cargo build -p anki --release --target "$TARGET" --features rustls
      - name: ABI and semantic export audit
        run: |
          LIB=third_party/anki/target/$TARGET/release/libanki.so
          test -f "$LIB"
          cp "$LIB" libanki-kanki.so
          file libanki-kanki.so
          readelf -h libanki-kanki.so | tee backend-elf.txt
          readelf -d libanki-kanki.so | tee backend-dynamic.txt
          nm -D libanki-kanki.so | grep -E ' kanki_(build_info_json|core_new|open_collection_json|deck_tree_json|next_card_json|prepare_answer_json|answer_json|bury_current_json|sync_core_new|sync_collection_json|sync_full_json|sync_media_json)$' | tee backend-exports.txt
          grep -q ' kanki_prepare_answer_json$' backend-exports.txt
          readelf --version-info libanki-kanki.so | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tee backend-glibc.txt || true
          LIBC=$(find "$KHF_SYSROOT" -name libc.so.6 | head -1)
          readelf --version-info "$LIBC" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu > sysroot-glibc.txt
          python3 - <<'PY'
          from pathlib import Path
          def version(line): return tuple(map(int, line.strip().split('_',1)[1].split('.')))
          required = [version(line) for line in Path('backend-glibc.txt').read_text().splitlines() if line]
          available = [version(line) for line in Path('sysroot-glibc.txt').read_text().splitlines() if line]
          if required and available and max(required) > max(available):
              raise SystemExit(f'backend requires {max(required)}, sysroot provides {max(available)}')
          print(f'required_max={max(required) if required else None}')
          print(f'sysroot_max={max(available) if available else None}')
          PY
          sha256sum libanki-kanki.so > libanki-kanki.so.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: typed-anki-backend-kindlehf
          path: |
            libanki-kanki.so
            libanki-kanki.so.sha256
            backend-elf.txt
            backend-dynamic.txt
            backend-exports.txt
            backend-glibc.txt
            sysroot-glibc.txt
