[workspace]
resolver = "2"
members = [
  "crates/kanki-domain",
  "crates/kanki-renderer",
  "crates/kanki-app",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.92"
authors = ["Kanki contributors"]
repository = "https://github.com/melspixel/Kanki"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.50", features = ["derive"] }
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
