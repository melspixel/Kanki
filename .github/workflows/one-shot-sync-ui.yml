name: One-shot sync UI migration

on:
  push:
    branches: [rewrite-v1]
    paths:
      - 'tools/patch_sync_ui.py'
      - '.github/workflows/one-shot-sync-ui.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite-v1
          fetch-depth: 0
      - name: Apply explicit sync handoff migration
        run: python3 tools/patch_sync_ui.py
      - name: Syntax and shell gates
        run: |
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -fsigned-char -Wall -Wextra -Werror -fsyntax-only device/kanki_device.c -Ibridge
          sh -n scripts/kanki-launch.sh
          sh -n scripts/kanki-sync.sh
          grep -q 'kanki://sync/run?mode=normal' assets/device/sync.html
          grep -q 'kanki://sync/run?mode=upload' assets/device/sync.html
          grep -q 'kanki://sync/run?mode=download' assets/device/sync.html
      - name: Commit migrated device source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add device/kanki_device.c
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'sync UI already migrated'
            exit 0
          fi
          git commit -m 'Add explicit safe in-app sync handoff'
          git push origin HEAD:rewrite-v1
