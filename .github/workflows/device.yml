name: Kindle device shell

on:
  push:
    branches: [rewrite-v1]
    paths:
      - 'device/**'
      - 'assets/device/**'
      - 'assets/reviewer/**'
      - 'bridge/*.h'
      - 'scripts/kanki-launch.sh'
      - 'scripts/kanki-sync.sh'
      - 'tools/install_kindlehf_toolchain.sh'
      - '.github/workflows/device.yml'
  pull_request:
    branches: [main]
    paths:
      - 'device/**'
      - 'assets/device/**'
      - 'assets/reviewer/**'
      - 'bridge/*.h'
      - 'scripts/kanki-launch.sh'
      - 'scripts/kanki-sync.sh'
      - 'tools/install_kindlehf_toolchain.sh'
      - '.github/workflows/device.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Strict host syntax and ES5 parsing
        run: |
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -fsigned-char -Wall -Wextra -Werror -fsyntax-only device/kanki_device.c -Ibridge
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -fsigned-char -Wall -Wextra -Werror -fsyntax-only device/kanki_sync_cli.c -Ibridge
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -fsigned-char -Wall -Wextra -Werror -fsyntax-only device/kanki_raise.c
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -fsigned-char -Wall -Wextra -Werror -fsyntax-only device/kanki_diag_server.c
          node --check assets/device/decks.js
          node --check assets/reviewer/reviewer.js
          node --check assets/reviewer/css_compat.js
          node --check assets/reviewer/css_runtime.js
          node --check assets/reviewer/diagnostics.js
          sh -n scripts/kanki-launch.sh
          sh -n scripts/kanki-sync.sh
          sh -n tools/install_kindlehf_toolchain.sh
      - name: Architectural prohibitions
        run: |
          ! grep -R -E 'LD_PRELOAD|420px|LOGICAL_VIEWPORT_PX|service[_ -]?index|method[_ -]?index' device assets/device scripts/kanki-launch.sh scripts/kanki-sync.sh
          ! grep -R -E 'COCA-English|dictionary-logo-link|\.pos-badge|\.word[[:space:]]*\{' assets/reviewer device
          ! grep -R -E '^[[:space:]]*svg[[:space:]]*\{' assets/reviewer/*.css
          ! grep -R -E 'log_message\([^;]*hkey|fprintf\([^;]*hkey[[:space:]]*=' device
          ! grep -R -E '(>>|>)[[:space:]]*"?\$LOG"?.*\$HKEY|\$HKEY.*(>>|>)[[:space:]]*"?\$LOG"?' scripts
          ! grep -R -F 'releases/latest/download/kindlehf' .github/workflows tools

  armhf-shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned KindleHF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          bash tools/install_kindlehf_toolchain.sh
          echo "$HOME/x-tools/arm-kindlehf-linux-gnueabihf/bin" >> "$GITHUB_PATH"
      - name: Build dynamic Kindle UI, sync, diagnostics and reactivation clients
        run: |
          arm-kindlehf-linux-gnueabihf-gcc -std=c11 -Os -fsigned-char -Wall -Wextra -Werror -Ibridge \
            -DKANKI_BUILD_COMMIT=\"$GITHUB_SHA\" \
            -DKANKI_ANKI_COMMIT=\"e5a6fbe27fdd4d57d5f712191b4a753032e57853\" \
            device/kanki_device.c -ldl -o kanki-device
          arm-kindlehf-linux-gnueabihf-gcc -std=c11 -Os -fsigned-char -Wall -Wextra -Werror -Ibridge \
            device/kanki_sync_cli.c -ldl -o kanki-sync
          arm-kindlehf-linux-gnueabihf-gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Os -fsigned-char -Wall -Wextra -Werror \
            device/kanki_diag_server.c -o kanki-diag
          arm-kindlehf-linux-gnueabihf-gcc -std=c11 -Os -fsigned-char -Wall -Wextra -Werror \
            -ffreestanding -fno-builtin -fno-stack-protector -nostdlib \
            -Wl,-e,_start -Wl,--dynamic-linker=/lib/ld-linux-armhf.so.3 \
            device/kanki_raise.c -ldl -o kanki-raise
          file kanki-device kanki-sync kanki-diag kanki-raise
          arm-kindlehf-linux-gnueabihf-readelf -h kanki-device | tee device-elf.txt
          arm-kindlehf-linux-gnueabihf-readelf -h kanki-sync | tee sync-elf.txt
          arm-kindlehf-linux-gnueabihf-readelf -h kanki-diag | tee diag-elf.txt
          arm-kindlehf-linux-gnueabihf-readelf -h kanki-raise | tee raise-elf.txt
          arm-kindlehf-linux-gnueabihf-readelf --version-info kanki-device \
            | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tee device-glibc.txt || true
          arm-kindlehf-linux-gnueabihf-readelf --version-info kanki-sync \
            | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tee sync-glibc.txt || true
          arm-kindlehf-linux-gnueabihf-readelf --version-info kanki-diag \
            | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tee diag-glibc.txt || true
          arm-kindlehf-linux-gnueabihf-readelf --version-info kanki-raise \
            | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tee raise-glibc.txt || true
          arm-kindlehf-linux-gnueabihf-nm -D kanki-device | grep -E ' U (dlopen|dlsym|dlclose)' | tee device-dynamic-imports.txt
          arm-kindlehf-linux-gnueabihf-nm -D kanki-sync | grep -E ' U (dlopen|dlsym|dlclose)' | tee sync-dynamic-imports.txt
          arm-kindlehf-linux-gnueabihf-nm -D kanki-raise | grep -E ' U (dlopen|dlsym|dlclose)' | tee raise-dynamic-imports.txt
          ! arm-kindlehf-linux-gnueabihf-nm -D kanki-raise | grep -E ' U (malloc|free|memcpy|memset|fprintf|getenv|setenv|write)$'
      - uses: actions/upload-artifact@v4
        with:
          name: kindle-device-shell
          path: |
            kanki-device
            kanki-sync
            kanki-diag
            kanki-raise
            device-elf.txt
            sync-elf.txt
            diag-elf.txt
            raise-elf.txt
            device-glibc.txt
            sync-glibc.txt
            diag-glibc.txt
            raise-glibc.txt
            device-dynamic-imports.txt
            sync-dynamic-imports.txt
            raise-dynamic-imports.txt
